<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="description" content="Kalendář docházky do gymu. Žádný výkon, žádný gains — jediná otázka: dokopal ses tam?" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Drž tempo" />
<meta name="theme-color" content="#1B1220" id="metaTheme" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="application-name" content="Drž tempo" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<title>Drž tempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== THEMES ===== */
  :root, [data-theme="dark"]{
    --bg:#1B1220; --glow:#2A1B31; --panel:#271A2C; --panel-2:#221627; --field:#1C1220; --line:#3B2A41;
    --text:#F2E9DC; --muted:#B39FB3;
    --accent:#E4B75A; --accent-bright:#F4D488; --accent-deep:#A97F2C; --on-accent:#3A2510;
    --today:#DD8FA8;
    --shadow:0 18px 40px -18px rgba(0,0,0,.75);
  }
  [data-theme="light"]{
    --bg:#F6F1E9; --glow:#FFFFFF; --panel:#FFFFFF; --panel-2:#FBF6EE; --field:#F1EADC; --line:#E5DBCB;
    --text:#2E2430; --muted:#8A7E86;
    --accent:#B98A2E; --accent-bright:#D8A94A; --accent-deep:#8A6420; --on-accent:#3A2510;
    --today:#C46B86;
    --shadow:0 16px 34px -20px rgba(70,50,40,.30);
  }
  [data-theme="wine"]{
    --bg:#241017; --glow:#371722; --panel:#31151F; --panel-2:#2A1119; --field:#1F0C13; --line:#4C2433;
    --text:#F4E9E3; --muted:#C29BA6;
    --accent:#E0A45C; --accent-bright:#F2C787; --accent-deep:#A6742E; --on-accent:#3A2410;
    --today:#E289A2;
    --shadow:0 18px 40px -18px rgba(0,0,0,.75);
  }
  [data-theme="coal"]{
    --bg:#17191C; --glow:#25282D; --panel:#202329; --panel-2:#1B1E23; --field:#131518; --line:#343941;
    --text:#ECEDEE; --muted:#9CA3AD;
    --accent:#E0B554; --accent-bright:#F0D084; --accent-deep:#A5822F; --on-accent:#33280E;
    --today:#DE8FA5;
    --shadow:0 18px 40px -18px rgba(0,0,0,.75);
  }
  [data-theme="navy"]{
    --bg:#0F1A2B; --glow:#1B2B45; --panel:#16253C; --panel-2:#111E31; --field:#0C1524; --line:#2A3E5E;
    --text:#E9EEF6; --muted:#96A6C0;
    --accent:#E7BC62; --accent-bright:#F4D68E; --accent-deep:#AB8534; --on-accent:#33280E;
    --today:#E08FA9;
    --shadow:0 18px 40px -18px rgba(0,0,0,.75);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(120% 80% at 50% -10%, var(--glow) 0%, var(--bg) 55%), var(--bg);
    color:var(--text); font-family:"Space Grotesk", system-ui, sans-serif;
    min-height:100dvh; -webkit-font-smoothing:antialiased;
    position:relative;
    padding:calc(22px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    transition:background .35s ease, color .35s ease;
  }
  .wrap{max-width:460px;margin:0 auto;}

  /* ===== settings ===== */
  .gear{
    position:absolute; top:calc(14px + env(safe-area-inset-top)); right:14px; z-index:40;
    width:42px;height:42px;border-radius:50%;cursor:pointer;padding:0;
    display:grid;place-items:center;
    background:transparent;border:none;color:var(--muted);
    transition:transform .15s,color .15s;
  }
  .gear svg{display:block;}
  .gear:hover{transform:rotate(20deg);color:var(--accent);}
  .passes{
    position:absolute; top:calc(24px + env(safe-area-inset-top)); right:72px; z-index:40;
    display:flex; gap:7px; background:none; border:none; padding:0; cursor:pointer; color:var(--accent);
  }
  .passes[hidden]{display:none;}
  .passes svg{display:block;transform:rotate(-8deg);filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));}
  .passes:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;}
  .gear:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .theme-pop{
    position:absolute; top:calc(64px + env(safe-area-inset-top)); right:14px; z-index:39;
    width:216px; background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:8px; box-shadow:var(--shadow);
  }
  .theme-pop[hidden]{display:none;}
  .theme-pop .h{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:6px 8px 8px;}
  .theme-opt{
    display:flex;align-items:center;gap:11px;width:100%;background:transparent;border:none;
    border-radius:10px;padding:9px 8px;cursor:pointer;color:var(--text);
    font-family:"Space Grotesk",sans-serif;font-size:13.5px;text-align:left;
  }
  .theme-opt:hover{background:color-mix(in srgb, var(--accent) 12%, transparent);}
  .theme-opt .sw{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;border:1px solid var(--line);}
  .theme-opt .sw i{width:9px;height:9px;border-radius:50%;display:block;}
  .theme-opt .tname{flex:1;}
  .theme-opt .chk{color:var(--accent);font-weight:700;opacity:0;font-size:14px;}
  .theme-opt.sel .chk{opacity:1;}
  .theme-opt.sel .sw{box-shadow:0 0 0 2px var(--accent);}
  .day-chips{display:flex;gap:4px;padding:0 6px 8px;}
  .dchip{flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;font-family:"Space Grotesk",sans-serif;text-align:center;}
  .dchip.sel{background:color-mix(in srgb, var(--accent) 15%, transparent);border-color:var(--accent-deep);color:var(--accent);}
  .dchip:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .day-note{font-size:10px;color:var(--muted);padding:0 8px 8px;line-height:1.4;}

  /* ===== header ===== */
  .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);opacity:.9;margin:0 0 6px;font-weight:600;padding-right:130px;}
  h1{font-family:"Bodoni Moda", Georgia, serif;font-weight:500;font-size:44px;line-height:.95;margin:0;letter-spacing:-.01em;}
  h1 em{font-style:italic;color:var(--accent);}
  .lede{color:var(--muted);font-size:13.5px;margin:10px 0 0;line-height:1.5;max-width:34ch;}

  .stats{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;margin:22px 0 8px;}
  .stat{background:linear-gradient(160deg, var(--panel) 0%, var(--panel-2) 100%);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .stat.hero{border-color:color-mix(in srgb, var(--accent) 35%, var(--line));}
  .stat.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;background:radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%);}
  .stat .k{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;}
  .stat .v{font-family:"Bodoni Moda",serif;font-weight:600;font-size:40px;line-height:1;}
  .stat.hero .v{color:var(--accent);}
  .stat .u{font-size:12px;color:var(--muted);margin-top:3px;}
  .pep{font-size:13px;color:var(--text);opacity:.9;margin:2px 2px 0;min-height:18px;font-style:italic;font-family:"Bodoni Moda",serif;}

  .cal{background:linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);border:1px solid var(--line);border-radius:20px;padding:16px 14px 18px;margin-top:16px;box-shadow:var(--shadow);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .month{font-family:"Bodoni Moda",serif;font-size:21px;font-weight:500;}
  .month small{display:block;font-family:"Space Grotesk",sans-serif;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-top:1px;}
  .nav{display:flex;gap:6px;}
  .nav button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:16px;cursor:pointer;display:grid;place-items:center;transition:background .15s,border-color .15s;}
  .nav button:hover{background:color-mix(in srgb, var(--accent) 12%, transparent);border-color:var(--accent-deep);}
  .nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;}
  .dow span{text-align:center;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:2px 0;}
  .dow span.beat{color:var(--accent);font-weight:600;}

  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .day{position:relative;aspect-ratio:1/1;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--text);font-size:14px;font-weight:500;cursor:pointer;display:grid;place-items:center;transition:transform .12s,background .15s,border-color .15s;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
  .day .nd{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4.5px;height:4.5px;border-radius:50%;background:var(--accent-deep);z-index:3;}
  .day.done .nd{background:var(--on-accent);}
  .day.frozen{border:1.5px dashed color-mix(in srgb, var(--accent) 65%, transparent);background:color-mix(in srgb, var(--accent) 10%, transparent);}
  .day.frozen .n{color:var(--accent-deep);}
  .day.frozen .tk{position:absolute;bottom:2.5px;left:50%;transform:translateX(-50%) rotate(-8deg);color:var(--accent-deep);z-index:3;line-height:0;}
  .day.pad{cursor:default;opacity:0;pointer-events:none;}
  .day.out{color:var(--muted);opacity:.4;}
  .day .n{position:relative;z-index:2;}
  .day.sched{border-color:color-mix(in srgb, var(--accent) 45%, transparent);background:color-mix(in srgb, var(--accent) 7%, transparent);}
  .day.sched .n{color:var(--accent-deep);}
  .day.today{box-shadow:inset 0 0 0 1.5px var(--today);}
  .day.today .n{color:var(--today);}
  .day.done{background:radial-gradient(120% 120% at 30% 20%, var(--accent-bright) 0%, var(--accent) 45%, var(--accent-deep) 100%);border-color:var(--accent-bright);}
  .day.done .n{color:var(--on-accent);font-weight:700;}
  .day.done::before{content:"";position:absolute;inset:0;z-index:1;border-radius:12px;box-shadow:0 6px 16px -6px color-mix(in srgb, var(--accent) 60%, transparent);}
  .day.done.bonus{background:radial-gradient(120% 120% at 30% 20%, color-mix(in srgb, var(--accent-bright) 65%, #fff) 0%, var(--accent) 55%, var(--accent-deep) 100%);}
  .day.done.bonus::after{content:"+";position:absolute;top:3px;right:6px;font-size:10px;font-weight:700;color:var(--on-accent);z-index:3;opacity:.85;}
  .day:hover:not(.pad):not(.done){background:color-mix(in srgb, var(--accent) 13%, transparent);}
  .day:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .day:active:not(.pad){transform:scale(.9);}
  @keyframes bloom{0%{transform:scale(.55);}60%{transform:scale(1.12);}100%{transform:scale(1);}}
  .day.pop{animation:bloom .34s cubic-bezier(.2,.9,.3,1.4);}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
  .legend span{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);}
  .dot{width:13px;height:13px;border-radius:5px;flex:none;}
  .dot.d1{border:1px solid color-mix(in srgb, var(--accent) 50%, transparent);background:color-mix(in srgb, var(--accent) 8%, transparent);}
  .dot.d2{background:linear-gradient(160deg,var(--accent-bright),var(--accent-deep));}
  .dot.d3{box-shadow:inset 0 0 0 1.5px var(--today);}
  .dot.d4{border:1.5px dashed color-mix(in srgb, var(--accent) 65%, transparent);background:color-mix(in srgb, var(--accent) 10%, transparent);}

  .plan{background:linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);border:1px solid var(--line);border-radius:20px;padding:18px 18px 6px;margin-top:16px;box-shadow:var(--shadow);}
  .plan-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .plan h2{font-family:"Bodoni Moda",serif;font-weight:500;font-size:22px;margin:0 0 2px;}
  .edit-btn{background:transparent;border:1px solid var(--line);color:var(--accent);border-radius:9px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:"Space Grotesk",sans-serif;flex:none;transition:background .15s;}
  .edit-btn:hover{background:color-mix(in srgb, var(--accent) 10%, transparent);}
  .edit-btn.done-btn{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
  .sub{color:var(--muted);font-size:12px;margin:0 0 14px;}

  .plan-tabs{display:flex;gap:6px;margin:2px 0 10px;}
  .ptab{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:7px 4px 6px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:"Space Grotesk",sans-serif;transition:background .15s,color .15s,border-color .15s;}
  .ptab small{display:block;font-weight:400;font-size:10px;opacity:.85;margin-top:1px;letter-spacing:.04em;}
  .ptab:hover{background:color-mix(in srgb, var(--accent) 8%, transparent);}
  .ptab.sel{background:color-mix(in srgb, var(--accent) 14%, transparent);border-color:var(--accent-deep);color:var(--accent);}
  .ptab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .copy-all{display:block;width:100%;background:none;border:none;color:var(--muted);font-size:11.5px;cursor:pointer;opacity:.7;font-family:"Space Grotesk",sans-serif;padding:10px 0 12px;letter-spacing:.03em;}
  .copy-all:hover{opacity:1;color:var(--accent);}
  .tpl-row{margin:0 0 12px;}
  .tpl-sel{cursor:pointer;color:var(--muted);appearance:auto;-webkit-appearance:auto;}
  .tpl-sel:focus{color:var(--text);}

  .move{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--line);}
  .move:first-of-type{border-top:none;}
  .move .idx{font-family:"Bodoni Moda",serif;font-size:15px;color:var(--accent);width:22px;flex:none;font-style:italic;}
  .move .mbody{flex:1;}
  .move .name{font-size:14.5px;font-weight:500;}
  .move .hint{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4;}
  .move .rep{font-family:"Space Grotesk",sans-serif;font-size:13px;font-weight:600;color:var(--accent-deep);white-space:nowrap;flex:none;}

  .foot{margin:12px -18px 0;padding:12px 18px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.5;}
  .foot b{color:var(--text);font-weight:600;}

  /* 16px minimum — menší písmo ve formulářovém poli spouští na iOS auto-zoom při fokusu */
  .field{background:var(--field);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font-family:inherit;font-size:16px;width:100%;}
  .field:focus{outline:none;border-color:var(--accent-deep);}
  .field::placeholder{color:color-mix(in srgb, var(--muted) 75%, transparent);}
  .sub-input{margin-bottom:14px;}
  .edit-move{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
  .edit-top{display:flex;gap:8px;}
  .name-wrap{position:relative;flex:1;min-width:0;}
  .in-rep{width:92px;flex:none;text-align:center;}
  .sugg{position:absolute;left:0;right:-100px;top:calc(100% + 4px);z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:230px;overflow-y:auto;padding:4px;}
  .sugg[hidden]{display:none;}
  .sopt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;background:none;border:none;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--text);font-family:"Space Grotesk",sans-serif;font-size:13.5px;}
  .sopt:hover{background:color-mix(in srgb, var(--accent) 10%, transparent);}
  .srep{color:var(--muted);font-size:11.5px;white-space:nowrap;flex:none;}
  .in-hint{margin-top:8px;resize:vertical;min-height:38px;line-height:1.35;}
  .edit-actions{display:flex;gap:6px;margin-top:8px;align-items:center;}
  .mini{width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font-size:15px;}
  .mini:hover{background:color-mix(in srgb, var(--accent) 10%, transparent);border-color:var(--accent-deep);}
  .mini:disabled{opacity:.3;cursor:default;}
  .del{margin-left:auto;color:var(--today);border:1px solid color-mix(in srgb, var(--today) 45%, transparent);background:transparent;border-radius:8px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:"Space Grotesk",sans-serif;}
  .del:hover{background:color-mix(in srgb, var(--today) 12%, transparent);}
  .add-move{width:100%;border:1px dashed var(--accent-deep);background:color-mix(in srgb, var(--accent) 6%, transparent);color:var(--accent);border-radius:12px;padding:13px;font-size:13px;font-weight:600;cursor:pointer;font-family:"Space Grotesk",sans-serif;margin:2px 0 4px;}
  .add-move:hover{background:color-mix(in srgb, var(--accent) 13%, transparent);}

  /* ===== deník ===== */
  .jrow{display:block;width:100%;text-align:left;background:transparent;border:none;border-top:1px solid var(--line);padding:11px 0;cursor:pointer;color:var(--text);font-family:"Space Grotesk",sans-serif;}
  .jrow:hover .jd{color:var(--accent);}
  .jrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px;}
  .jd{font-size:12px;font-weight:600;color:var(--accent-deep);display:flex;align-items:center;gap:7px;letter-spacing:.03em;}
  .jd .att{width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%, var(--accent-bright), var(--accent-deep));flex:none;}
  .jt{font-size:13px;opacity:.92;margin-top:3px;line-height:1.45;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}

  /* ===== modal poznámky ===== */
  .modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(0,0,0,.55);padding:20px;}
  .modal[hidden]{display:none;}
  .modal-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  .modal-card .note-ta{user-select:text;-webkit-user-select:text;}
  .pass-card{text-align:center;padding:24px 20px 18px;}
  .pass-card .pass-icon{color:var(--accent);display:flex;justify-content:center;margin-bottom:10px;}
  .pass-card .pass-icon svg{transform:rotate(-8deg);filter:drop-shadow(0 6px 14px color-mix(in srgb, var(--accent) 45%, transparent));}
  .pass-card .modal-title{font-size:24px;}
  .pass-text{color:var(--muted);font-size:13.5px;line-height:1.55;margin:8px 0 16px;}
  .pass-card .edit-btn{width:100%;padding:11px;font-size:14px;}
  .modal-title{font-family:"Bodoni Moda",serif;font-size:19px;}
  .modal-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .note-ta{margin-top:12px;min-height:110px;resize:vertical;line-height:1.5;}
  .modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:12px;}

  .tools{display:flex;justify-content:center;align-items:center;gap:10px;margin:22px auto 0;flex-wrap:wrap;}
  .tool{background:none;border:none;color:var(--muted);font-size:11.5px;letter-spacing:.05em;cursor:pointer;opacity:.65;font-family:"Space Grotesk",sans-serif;padding:4px 2px;}
  .tool:hover{opacity:1;color:var(--accent);}
  .tool.danger:hover{color:var(--today);}
  .tool:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;opacity:1;}
  .tool-sep{color:var(--muted);opacity:.4;font-size:11px;}
  .day:disabled{cursor:default;pointer-events:none;}

<script>
(function(){
  "use strict";

  const mem={};
  const store={
    get(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in mem)?mem[k]:null; } },
    set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
  };
  const K_ATT="tempo:attended:v1", K_MOVES="tempo:moves:v1", K_SUB="tempo:sub:v1", K_THEME="tempo:theme:v1", K_PLANS="tempo:plans:v2", K_SCHED="tempo:sched:v1", K_BYDAY="tempo:plansByDay:v3", K_SCHED_H="tempo:schedHist:v1", K_NOTES="tempo:notes:v1", K_PASS="tempo:passes:v1";

  const THEMES=[
    {id:"dark",  name:"Parket (tmavé)", bg:"#1B1220", accent:"#E4B75A"},
    {id:"light", name:"Sál (světlé)",   bg:"#F6F1E9", accent:"#B98A2E"},
    {id:"wine",  name:"Vínová",         bg:"#241017", accent:"#E0A45C"},
    {id:"coal",  name:"Antracit",       bg:"#17191C", accent:"#E0B554"},
    {id:"navy",  name:"Námořní",        bg:"#0F1A2B", accent:"#E7BC62"}
  ];

  const DEFAULT_MOVES=[
    {name:"Rozehřátí", rep:"5 min", hint:"Rozhýbat se, roztančit. Tohle umíš líp než já."},
    {name:"Dřep s vlastní vahou", rep:"10–15×", hint:"Paty na zemi, koleno směr špička."},
    {name:"Klik", rep:"5–10×", hint:"Start o zeď nebo z kolen → časem plný."},
    {name:"Přítah / TRX", rep:"5–10×", hint:"Záda. Nepřeskakovat, jinak budeš nevyvážený."},
    {name:"Glute bridge", rep:"12–15×", hint:"Zvednout boky, nahoře stisknout hýždě."},
    {name:"Hollow / plank", rep:"20–30 s", hint:"Core. Hollow body ti bude povědomý z tance."}
  ];
  const DEFAULT_SUB="~25 min · 2–3 kola okruhu";

  /* katalog nejčastějších cviků pro našeptávač (včetně Adelina plánu) */
  const CATALOG=[
    {name:"Rozehřátí", rep:"5 min", hint:"Rozhýbat se, roztančit. Tohle umíš líp než já."},
    {name:"Mobilita", rep:"5–10 min", hint:"Rozhýbat klouby: kyčle, ramena, páteř. Pár dřepů bez zátěže."},
    {name:"Chůze / lehké kardio", rep:"10 min", hint:"Pás, rotoped nebo šlapadlo, volné tempo."},
    {name:"Goblet Squat", rep:"3×8–10", hint:"Jednoručka u hrudníku, paty na zemi, koleno směr špička."},
    {name:"Dřep s vlastní vahou", rep:"10–15×", hint:"Paty na zemi, koleno směr špička."},
    {name:"Front Squat", rep:"3×8–10", hint:"Činka na předních ramenech, vzpřímený trup."},
    {name:"Hack Squat", rep:"3×8–10", hint:"Na stroji, záda opřená, tlačit přes paty."},
    {name:"Leg Press", rep:"3×10", hint:"Kolena směr špičky, dole neprolamovat bedra."},
    {name:"Bulgarian Split Squat", rep:"2–3×8 na nohu", hint:"Zadní noha na lavičce, trup mírně vpřed."},
    {name:"Reverse Lunge", rep:"3×8 na nohu", hint:"Krok vzad, zadní koleno těsně nad zem."},
    {name:"Romanian Deadlift", rep:"3×8–10", hint:"Rovná záda, boky dozadu, cítit protažení hamstringů."},
    {name:"Kettlebell Deadlift", rep:"3×8–10", hint:"Kettlebell mezi chodidly, rovná záda, zvedat nohama."},
    {name:"Trap Bar Deadlift", rep:"3×8–10", hint:"Šestihranná osa, přirozenější pozice než klasický mrtvý tah."},
    {name:"Mrtvý tah", rep:"3×5–8", hint:"Core zpevněný, tah nohama a zády, ne bedry."},
    {name:"Hip Thrust", rep:"3×10–12", hint:"Lopatky o lavičku, nahoře stisknout hýždě."},
    {name:"Glute bridge", rep:"12–15×", hint:"Zvednout boky, nahoře stisknout hýždě."},
    {name:"Kettlebell Swing", rep:"3×15", hint:"Švih jde z boků, ne z rukou ani beder."},
    {name:"Seated Cable Row", rep:"3×10", hint:"Tah k břichu, lopatky k sobě, neprohýbat se."},
    {name:"Chest Supported Row", rep:"3×10", hint:"Hrudník opřený o šikmou lavičku, čistý tah."},
    {name:"TRX Row", rep:"3×8–10", hint:"Čím víc do vodorovna, tím těžší."},
    {name:"Přítah jednoručky v předklonu", rep:"3×8–10 na ruku", hint:"Koleno a ruka o lavičku, rovná záda."},
    {name:"Lat Pulldown", rep:"3×8–10", hint:"Tah kladky k hornímu hrudníku, lokty dolů."},
    {name:"Assisted Pull-up", rep:"3×5–8", hint:"Shyb s dopomocí stroje nebo gumy."},
    {name:"Shyb (Pull-up)", rep:"3×max", hint:"Plný rozsah, bez houpání."},
    {name:"Chin-up (podhmat)", rep:"3×5–8", hint:"Dlaně k sobě — lehčí než nadhmat, sbírej s ním objem."},
    {name:"Shyb s gumou", rep:"4×6–8", hint:"Guma tak, aby 8. opakování bylo těžké. 3×8 čistě → tenčí guma."},
    {name:"Negativní shyb", rep:"4×3", hint:"Výstup po bedně, brada nad hrazdou, spouštění 5–8 s."},
    {name:"Shyb – singly", rep:"5×1", hint:"Každé opakování čisté, pauza 2 min. Až dáš 5×2, přejdi na 4×3."},
    {name:"Shybový žebřík", rep:"1-2-3-2-1 × 3", hint:"Pauzy 60–90 s. S gumou tak, aby to šlo čistě."},
    {name:"Scapular pull-up", rep:"2×8", hint:"Vis s rovnými lokty, jen stáhnout lopatky dolů a zpět."},
    {name:"Dead hang", rep:"3×30–45 s", hint:"Volný vis, ramena aktivní. Úchop a lopatky."},
    {name:"Hollow hold", rep:"3×20–30 s", hint:"Bedra tisknout k zemi — pozice, kterou držíš v shybu."},
    {name:"Incline DB Press", rep:"3×8–10", hint:"Tlak jednoruček na šikmé lavičce."},
    {name:"Flat DB Press", rep:"3×8–10", hint:"Tlak jednoruček vleže na rovné lavičce."},
    {name:"Bench Press", rep:"3×8", hint:"Lopatky stažené, chodidla pevně na zemi."},
    {name:"Klik", rep:"5–10×", hint:"Start o zeď nebo z kolen → časem plný."},
    {name:"Landmine Press", rep:"3×8–10", hint:"Tlak konce činky šikmo vzhůru, jednou rukou."},
    {name:"DB Shoulder Press", rep:"3×8–10", hint:"Tlak jednoruček nad hlavu, nezaklánět se."},
    {name:"Farmer Carry", rep:"3 kola", hint:"Těžké, ale technicky čisté. Zpevněný trup, ramena dole."},
    {name:"Suitcase Carry", rep:"3 kola", hint:"Zátěž jen v jedné ruce, trup se nesmí naklánět."},
    {name:"Dead Bug", rep:"2–3×10", hint:"Bedra tisknout k zemi, pomalu natahovat protilehlé končetiny."},
    {name:"Side Plank", rep:"2–3×30 s", hint:"Boky nahoře, tělo v jedné rovině."},
    {name:"Plank", rep:"20–30 s", hint:"Zpevněný core, neprověšovat bedra."},
    {name:"Hollow / plank", rep:"20–30 s", hint:"Core. Hollow body ti bude povědomý z tance."},
    {name:"Pallof Press", rep:"2–3×10", hint:"Předpažit proti tahu kladky, nenechat se rotovat."},
    {name:"Biceps curl", rep:"3×10–12", hint:"Lokty u těla, bez švihu."},
    {name:"Triceps stahování kladky", rep:"3×10–12", hint:"Lokty u těla, dole propnout."},
    {name:"Veslování (trenažér)", rep:"10 min", hint:"Pořadí: nohy → trup → paže."}
  ];

  /* hotové plány k načtení do dnů A/B/C… (cx = vzít reps a hint z katalogu) */
  const cx=(name,o)=>{ const c=CATALOG.find(x=>x.name===name)||{}; o=o||{}; return {name, rep:o.rep||c.rep||"", hint:o.hint||c.hint||""}; };
  const TEMPLATES=[
    {id:"pullups", name:"Cesta k 10 shybům · 3 dny", plans:[
      {sub:"Síla · ~35 min · shyby první, když jsi čerstvý", moves:[
        cx("Rozehřátí",{hint:"Rozhýbat ramena a lopatky, kroužení, lehký vis."}),
        cx("Scapular pull-up"),
        cx("Shyb – singly"),
        cx("Negativní shyb",{hint:"Hned po singlech. Výstup po bedně, spouštění 6–8 s."}),
        cx("Lat Pulldown",{rep:"4×6–8",hint:"Těžce. Tah k hornímu hrudníku, lokty dolů."}),
        cx("Hollow hold"),
        cx("Goblet Squat",{hint:"Ať nohy nezahálí."})
      ]},
      {sub:"Objem · ~35 min · guma tak, aby 8. opakování bylo těžké", moves:[
        cx("Rozehřátí",{hint:"Rozhýbat ramena a lopatky, kroužení, lehký vis."}),
        cx("Shyb s gumou",{hint:"3×8 čistě → tenčí guma. Poslední guma pryč = shyby jedou."}),
        cx("TRX Row",{rep:"3×10–12",hint:"Horizontální tah, ať jsou záda vyvážená."}),
        cx("Biceps curl",{hint:"U shybu dřou víc, než se říká."}),
        cx("Farmer Carry",{hint:"Úchop je často to, co povolí první."}),
        cx("Klik",{rep:"3×8–10",hint:"Trochu tlaku, ať to není jednostranné."}),
        cx("Romanian Deadlift")
      ]},
      {sub:"Technika a žebřík · ~30 min · kvalita před počtem", moves:[
        cx("Rozehřátí",{hint:"Rozhýbat ramena a lopatky, kroužení, lehký vis."}),
        cx("Dead hang"),
        cx("Shybový žebřík",{hint:"S gumou tak, aby to šlo čistě; pauzy 60–90 s. Čisté 1-2-3-4-3-2-1 bez gumy = desítka je za rohem."}),
        cx("Chest Supported Row"),
        cx("Pallof Press"),
        cx("Hip Thrust")
      ]}
    ]},
    {id:"fullbody", name:"Full body · 3 dny (12 týdnů, RIR 2)", plans:[
      {sub:"Den 1 · ~45 min · RIR 2 (ještě 2 opakování v záloze)", moves:[
        cx("Chůze / lehké kardio",{rep:"5–10 min",hint:"Chůze + mobilita."}), cx("Goblet Squat"), cx("Seated Cable Row"), cx("Incline DB Press"),
        cx("Romanian Deadlift"), cx("Farmer Carry"), cx("Dead Bug")
      ]},
      {sub:"Den 2 · ~45 min · RIR 2", moves:[
        cx("Mobilita"), cx("Bulgarian Split Squat"), cx("Lat Pulldown"), cx("Landmine Press"),
        cx("Hip Thrust"), cx("Side Plank"), cx("Chůze / lehké kardio",{rep:"10 min"})
      ]},
      {sub:"Den 3 · ~45 min · RIR 2", moves:[
        cx("Mobilita"), cx("Goblet Squat"), cx("TRX Row"), cx("Klik",{hint:"Varianta podle úrovně: o lavičku → z kolen → plný."}),
        cx("Kettlebell Deadlift",{hint:"Rumunský mrtvý tah s kettlebellem, rovná záda."}), cx("Farmer Carry"), cx("Pallof Press")
      ]}
    ]},
    {id:"basic", name:"Původní okruh (výchozí)", plans:[{sub:DEFAULT_SUB, moves:DEFAULT_MOVES}]}
  ];

  const MONTHS=["Leden","Únor","Březen","Duben","Květen","Červen","Červenec","Srpen","Září","Říjen","Listopad","Prosinec"];
  const MONTHS_GEN=["ledna","února","března","dubna","května","června","července","srpna","září","října","listopadu","prosince"];
  const DOW=["Po","Út","St","Čt","Pá","So","Ne"];
  const DAY_NAMES=["Ne","Po","Út","St","Čt","Pá","So"]; /* index = getDay() */
  const LETTERS="ABCDEFG";

  /* days = aktuální tréninkové dny (hodnoty getDay), byDay = plán pro každý den.
     schedHist = historie rozvrhu: [{from:"YYYY-MM-DD", days:[…]}]; každý den v minulosti
     se hodnotí podle rozvrhu platného v ten den, takže změna dnů nerozbije starý streak. */
  let attended=new Set(), days=[0,2,4], byDay={}, schedHist=[], notes={}, planIx=0, theme="dark", editing=false;
  /* propustky: avail = k dispozici (max 3), credited = kolik milníků po 10 trénincích už je započítaných,
     used = dny pokryté propustkou. passEvents = fronta oznámení pro modal. */
  const PASS_MAX=3, PASS_EVERY=10;
  let passes={avail:0,credited:0,used:[]}, passEvents=[];
  let view=new Date(); view.setDate(1);

  const $=id=>document.getElementById(id);
  const pad=n=>String(n).padStart(2,"0");
  const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const wk=d=>(d+6)%7; /* Po=0 … Ne=6, pro řazení podle týdne */
  const normDays=a=>{ if(!Array.isArray(a)) return null; const v=[...new Set(a.filter(n=>Number.isInteger(n)&&n>=0&&n<=6))]; return v.length?v.sort((x,y)=>wk(x)-wk(y)):null; };
  const normEntry=e=>{ const d=normDays(e&&e.days); return (d&&e&&typeof e.from==="string")?{from:e.from,days:d}:null; };
  const daysOn=d=>{ const k=keyOf(d); let cur=schedHist.length?schedHist[0].days:days; for(const e of schedHist){ if(e.from<=k) cur=e.days; else break; } return cur; };
  const isScheduled=d=>daysOn(d).includes(d.getDay());
  const planIxFor=d=>days.indexOf(d.getDay());
  const startOfToday=()=>{const t=new Date();t.setHours(0,0,0,0);return t;};
  const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
  const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
  const haptic=()=>{ if(navigator.vibrate){ navigator.vibrate(12); return; } const s=$("hapticSw"); if(s){ try{ s.click(); }catch(e){} } };

  function h(tag,attrs){
    const e=document.createElement(tag); attrs=attrs||{};
    for(const k in attrs){ const v=attrs[k];
      if(k==="class") e.className=v; else if(k==="text") e.textContent=v;
      else if(k==="value") e.value=v; else if(k.slice(0,2)==="on") e.addEventListener(k.slice(2).toLowerCase(),v);
      else if(v!==false&&v!=null) e.setAttribute(k,v);
    }
    for(let i=2;i<arguments.length;i++){ const c=arguments[i]; if(c==null) continue;
      e.appendChild(typeof c==="string"?document.createTextNode(c):c); }
    return e;
  }

  const normMove=m=>({name:String(m&&m.name||""),rep:String(m&&m.rep||""),hint:String(m&&m.hint||"")});
  const normPlan=p=>({
    moves:(p&&Array.isArray(p.moves)&&p.moves.length)?p.moves.map(normMove):DEFAULT_MOVES.map(m=>({...m})),
    sub:(p&&typeof p.sub==="string")?p.sub:DEFAULT_SUB
  });
  const clonePlan=p=>({sub:p.sub,moves:p.moves.map(m=>({...m}))});

  function load(){
    try{ const a=store.get(K_ATT); if(a) attended=new Set(JSON.parse(a)); }catch(e){}
    try{ const n=store.get(K_NOTES); if(n){ const o=JSON.parse(n); if(o&&typeof o==="object"&&!Array.isArray(o)){ notes={}; for(const k in o){ if(typeof o[k]==="string"&&o[k]) notes[k]=o[k]; } } } }catch(e){}
    /* propustky (při první migraci se přiznají zpětně za dosavadní tréninky) */
    let hadPass=false;
    try{ const p=store.get(K_PASS); if(p){ passes=normPasses(JSON.parse(p)); hadPass=true; } }catch(e){}
    if(!hadPass){
      passes.credited=Math.floor(attended.size/PASS_EVERY);
      passes.avail=Math.min(passes.credited,PASS_MAX);
      if(passes.avail>0) passEvents.push({type:"earned",count:passes.avail,migration:true});
      savePass();
    }
    /* tréninkové dny: historie změn; migrace ze staršího jednoduchého seznamu */
    let hist=null; try{ const s=store.get(K_SCHED_H); if(s) hist=JSON.parse(s); }catch(e){}
    if(Array.isArray(hist)) schedHist=hist.map(normEntry).filter(Boolean);
    if(!schedHist.length){
      let ds=null; try{ const s=store.get(K_SCHED); if(s) ds=JSON.parse(s); }catch(e){}
      schedHist=[{from:"2000-01-01",days:normDays(ds)||[0,2,4]}];
    }
    schedHist.sort((a,b)=>a.from<b.from?-1:1);
    days=daysOn(startOfToday()).slice();
    /* plány: v3 (podle dne) → v2 (pole A/B/C pro Ne/Út/Čt) → v1 (jeden plán) */
    let seed=null;
    let bd=null; try{ const p=store.get(K_BYDAY); if(p) bd=JSON.parse(p); }catch(e){}
    if(bd&&typeof bd==="object"&&!Array.isArray(bd)){ byDay={}; for(const k in bd) byDay[k]=normPlan(bd[k]); }
    else{
      let v2=null; try{ const p=store.get(K_PLANS); if(p) v2=JSON.parse(p); }catch(e){}
      if(Array.isArray(v2)&&v2.length===3){ byDay={0:normPlan(v2[0]),2:normPlan(v2[1]),4:normPlan(v2[2])}; }
      else{
        let om=null; try{ const m=store.get(K_MOVES); if(m) om=JSON.parse(m); }catch(e){}
        const os=store.get(K_SUB);
        seed=normPlan({moves:om,sub:(os!=null)?os:undefined});
      }
    }
    days.forEach(d=>{ if(!byDay[d]) byDay[d]=seed?clonePlan(seed):normPlan(null); });
    const t=store.get(K_THEME);
    if(t&&THEMES.some(x=>x.id===t)) theme=t;
    else theme=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";
    /* předvybrat plán na dnešek, případně na nejbližší tréninkový den */
    const today=startOfToday();
    for(let i=0;i<7;i++){ const ix=planIxFor(addDays(today,i)); if(ix>-1){ planIx=ix; break; } }
  }
  const saveAtt =()=>store.set(K_ATT, JSON.stringify([...attended]));
  const saveNotes=()=>store.set(K_NOTES, JSON.stringify(notes));
  const savePass=()=>store.set(K_PASS, JSON.stringify(passes));
  const normPasses=p=>({
    avail:Math.max(0,Math.min(PASS_MAX,(p&&Number.isInteger(p.avail))?p.avail:0)),
    credited:Math.max(0,(p&&Number.isInteger(p.credited))?p.credited:0),
    used:(p&&Array.isArray(p.used))?[...new Set(p.used.filter(x=>typeof x==="string"))]:[]
  });
  /* srovnat milníky po každé změně razítek (chrání i proti farmení přes škrtání a vracení) */
  function reconcilePasses(){
    const milestones=Math.floor(attended.size/PASS_EVERY);
    while(passes.credited<milestones){
      passes.credited++;
      if(passes.avail<PASS_MAX){ passes.avail++; passEvents.push({type:"earned",count:1}); }
    }
    if(passes.credited>milestones){
      const drop=passes.credited-milestones;
      passes.credited=milestones;
      passes.avail=Math.max(0,passes.avail-drop);
    }
    savePass();
  }
  const saveSched=()=>store.set(K_SCHED_H, JSON.stringify(schedHist));
  const savePlans=()=>store.set(K_BYDAY, JSON.stringify(byDay));
  const saveTheme=()=>store.set(K_THEME, theme);

  function tempo(){
    /* Zpětný průchod od dneška. Vynechané tréninkové dny se hromadí v `pending`;
       jakmile průchod narazí na odchozený den, vynechávky přemostí propustky.
       Spálí se ale až ve chvíli, kdy po výpadku zase přišel trénink (count>0) —
       jinak drží streak jen provizorně a propustky čekají. Když je vynechávek
       víc než propustek, streak se poctivě zlomí a propustky zůstanou. */
    const today=startOfToday(); let count=0, pending=[];
    for(let i=0;i<400;i++){ const d=addDays(today,-i);
      if(!isScheduled(d)) continue;
      const k=keyOf(d), done=attended.has(k);
      if(done){
        if(pending.length){
          if(count>0){
            passes.used.push(...pending);
            passes.avail-=pending.length;
            passEvents.push({type:"used",days:pending.slice()});
            savePass();
          }
          pending=[];
        }
        count++;
      }
      else if(passes.used.includes(k)){ /* dřív pokrytý den — streak pokračuje, nepočítá se */ }
      else if(sameDay(d,today)){ /* dnešek bez razítka nic neláme */ }
      else{
        pending.push(k);
        if(pending.length>passes.avail) break;
      }
    }
    return count;
  }
  function monthTotal(){ let c=0; for(const k of attended){ const [y,m]=k.split("-").map(Number); if(y===view.getFullYear()&&m===view.getMonth()+1) c++; } return c; }

  const pepFor=n=> n<=0?PEP[0]:(n<PEP.length?PEP[n]:`${n} v řadě. Tanečník se vrátil na parket. 💃`);

  /* ===== theme ===== */

  function toggleDay(d){
    let nd;
    if(days.includes(d)){
      if(days.length===1){ alert("Aspoň jeden tréninkový den musí zůstat."); return; }
      nd=days.filter(x=>x!==d); /* plán dne zůstává uložený pro případný návrat */
    }else{
      nd=normDays(days.concat(d));
      if(!byDay[d]) byDay[d]=normPlan(null);
    }
    /* změna platí od dneška: dnešní záznam v historii se přepíše, jinak se přidá nový */
    const todayK=keyOf(startOfToday());
    schedHist=schedHist.filter(e=>e.from<=todayK);
    if(!schedHist.length) schedHist=[{from:"2000-01-01",days:[0,2,4]}];
    const last=schedHist[schedHist.length-1];
    if(last.from===todayK) last.days=nd; else schedHist.push({from:todayK,days:nd});
    const n=schedHist.length; /* návrat k předchozímu rozvrhu týž den → záznam zahodit */
    if(n>1&&schedHist[n-1].from===todayK&&String(schedHist[n-2].days)===String(schedHist[n-1].days)) schedHist.pop();
    days=nd;
    if(planIx>=days.length) planIx=days.length-1;
    saveSched(); savePlans(); renderAll();
  }

  function renderCal(){
    const y=view.getFullYear(), m=view.getMonth();

    const today=startOfToday();

    for(let day=1;day<=dim;day++){

      btn.innerHTML=`<span class="n">${day}</span>${notes[k]?'<i class="nd"></i>':''}${frozen?'<i class="tk"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M22 10V6c0-1.1-.9-2-2-2H4c-1.1 0-1.99.9-1.99 2v4c1.1 0 1.99.9 1.99 2s-.89 2-2 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2s.9-2 2-2z"/></svg></i>':''}`;
      if(done){ btn.classList.add("done"); if(!sched) btn.classList.add("bonus"); } else if(frozen){ btn.classList.add("frozen"); } else if(sched){ btn.classList.add("sched"); }
      if(sameDay(d,today)) btn.classList.add("today");
      if(d>today&&!done){ btn.classList.add("out"); btn.disabled=true; }
      btn.setAttribute("aria-pressed",done?"true":"false");
      btn.setAttribute("aria-label",`${day}. ${MONTHS_GEN[m]} ${y}${done?" – orazítkováno":""}${frozen?" – kryto propustkou":""}${notes[k]?" – s poznámkou":""}`);
      /* klik = razítko; dlouhé podržení (nebo pravé tlačítko) = poznámka ke dni.
         Modal se otevírá až po puštění prstu — kdyby se objevil už během držení,
         Android na prvku pod prstem spustí výběr textu. */
      let lpTimer=null, lpFired=false, ptrType="mouse";
      const lpCancel=()=>{ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } };
      btn.addEventListener("pointerdown",e=>{ ptrType=e.pointerType||"mouse"; lpFired=false; lpCancel();
        lpTimer=setTimeout(()=>{ lpFired=true; haptic(); },500); });
      btn.addEventListener("pointerup",()=>{ lpCancel(); if(lpFired) openNote(k); });
      btn.addEventListener("pointerleave",lpCancel);
      btn.addEventListener("pointercancel",()=>{ lpCancel(); lpFired=false; });
      btn.addEventListener("contextmenu",ev=>{ ev.preventDefault();
        if(ptrType==="mouse"&&!lpFired){ lpCancel(); lpFired=true; openNote(k); } });
      btn.addEventListener("click",()=>{
        if(lpFired){ lpFired=false; return; }
        if(attended.has(k)){ attended.delete(k); }
        else{
          attended.add(k);
          /* dodatečné razítko na den krytý propustkou → propustka se vrací */
          const ui=passes.used.indexOf(k);
          if(ui>-1){ passes.used.splice(ui,1); passes.avail=Math.min(PASS_MAX,passes.avail+1); savePass(); }
          btn.classList.add("pop"); setTimeout(()=>btn.classList.remove("pop"),360);
        }

  }

  /* ===== propustky ===== */
  const TICKET='<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M22 10V6c0-1.1-.9-2-2-2H4c-1.1 0-1.99.9-1.99 2v4c1.1 0 1.99.9 1.99 2s-.89 2-2 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2s.9-2 2-2zm-9 7.5h-2v-2h2v2zm0-4.5h-2v-2h2v2zm0-4.5h-2v-2h2v2z"/></svg>';

  let noteKey=null;
  function openNote(k){
    noteKey=k;
    $("noteTitle").textContent=noteDateLbl(k);
    $("noteText").value=notes[k]||"";
    $("noteModal").hidden=false;
    $("noteText").focus();
  }
  function closeNote(){
    if(noteKey){
      const v=$("noteText").value.trim();
      if(v) notes[noteKey]=v; else delete notes[noteKey];
      saveNotes(); noteKey=null;
    }
    $("noteModal").hidden=true;
    renderCal(); renderJournal();
  }
  $("noteSave").addEventListener("click",closeNote);
  $("noteDel").addEventListener("click",()=>{ $("noteText").value=""; closeNote(); });
  /* zavřít klikem na pozadí — ale jen když tam klik i začal (jinak by modal
     zavřelo už samotné puštění prstu po dlouhém podržení dne v kalendáři) */
  let backdropDown=false;
  $("noteModal").addEventListener("pointerdown",e=>{ backdropDown=(e.target===$("noteModal")); });
  /* ghost-click po puštění dlouhého podržení dopadá na pozadí — nesmí sebrat fokus textarey */
  $("noteModal").addEventListener("mousedown",e=>{ if(e.target===$("noteModal")) e.preventDefault(); });
  $("noteModal").addEventListener("click",e=>{ if(e.target===$("noteModal")&&backdropDown){ backdropDown=false; closeNote(); } });

  /* ===== controls ===== */
  $("prev").addEventListener("click",()=>{view.setMonth(view.getMonth()-1);renderCal();});
  $("next").addEventListener("click",()=>{view.setMonth(view.getMonth()+1);renderCal();});
  $("jump").addEventListener("click",()=>{view=new Date();view.setDate(1);renderCal();});
  $("reset").addEventListener("click",()=>{ if(confirm("Vymazat všechna razítka? Přijdeš i o propustky. Cviky, poznámky a téma zůstanou. Tohle se nedá vrátit.")){ attended=new Set(); passes.used=[]; saveAtt(); reconcilePasses(); renderCal(); renderJournal(); } });

  /* ===== backup ===== */
  $("exportBtn").addEventListener("click",()=>{
    const data={app:"drz-tempo",version:6,exported:new Date().toISOString(),attended:[...attended],schedHist,plans:byDay,notes,passes,theme};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`drz-tempo-zaloha-${keyOf(new Date())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  });
  $("importBtn").addEventListener("click",()=>$("importFile").click());
  $("importFile").addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d||d.app!=="drz-tempo"||!Array.isArray(d.attended)) throw new Error("bad backup");
        if(!confirm("Nahradit aktuální data touto zálohou?")) return;
        attended=new Set(d.attended.filter(x=>typeof x==="string"));
        if(d.notes&&typeof d.notes==="object"&&!Array.isArray(d.notes)){ notes={}; for(const k in d.notes){ if(typeof d.notes[k]==="string"&&d.notes[k]) notes[k]=d.notes[k]; } saveNotes(); } /* v5 */
        if(d.passes&&typeof d.passes==="object"){ passes=normPasses(d.passes); } /* v6 */
        else{ passes={avail:Math.min(Math.floor(attended.size/PASS_EVERY),PASS_MAX),credited:Math.floor(attended.size/PASS_EVERY),used:[]}; } /* starší zálohy: odvodit */
        savePass();
        if(Array.isArray(d.schedHist)){ const hs=d.schedHist.map(normEntry).filter(Boolean); if(hs.length){ hs.sort((a,b)=>a.from<b.from?-1:1); schedHist=hs; } } /* v4 */
        else if(Array.isArray(d.days)&&d.days.length){ const nd=normDays(d.days); if(nd) schedHist=[{from:"2000-01-01",days:nd}]; } /* v3 */
        if(d.plans&&typeof d.plans==="object"&&!Array.isArray(d.plans)){ byDay={}; for(const k in d.plans) byDay[k]=normPlan(d.plans[k]); } /* v3+v4 */
        else if(Array.isArray(d.plans)&&d.plans.length===3){ schedHist=[{from:"2000-01-01",days:[0,2,4]}]; byDay={0:normPlan(d.plans[0]),2:normPlan(d.plans[1]),4:normPlan(d.plans[2])}; } /* v2 */
        else if(Array.isArray(d.moves)&&d.moves.length){ const base=normPlan({moves:d.moves,sub:d.sub}); byDay={}; days.forEach(x=>byDay[x]=clonePlan(base)); } /* v1 */
        days=daysOn(startOfToday()).slice();
        days.forEach(x=>{ if(!byDay[x]) byDay[x]=normPlan(null); });
        planIx=Math.min(planIx,days.length-1);
        if(typeof d.theme==="string"&&THEMES.some(x=>x.id===d.theme)) theme=d.theme;
        saveAtt(); saveSched(); savePlans(); applyTheme(theme); renderAll();
      }catch(err){ alert("Tohle nevypadá jako záloha z Drž tempo."); }
      finally{ e.target.value=""; }
    };
    r.readAsText(f);
  });

  $("gear").addEventListener("click",e=>{ e.stopPropagation(); const pop=$("themePop"); pop.hidden?openPop():closePop(); });
  $("themePop").addEventListener("click",e=>e.stopPropagation());
  document.addEventListener("click",()=>closePop());
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(!$("noteModal").hidden) closeNote(); else if(!$("passModal").hidden){ $("passModal").hidden=true; flushPassEvents(); } else closePop(); } });

  /* ===== init ===== */
  load(); applyTheme(theme); renderAll();

  /* offline: service worker funguje jen přes http(s), při otevření souboru z disku se přeskočí */
  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
    window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
  }
})();
</script>
</body>
</html>
